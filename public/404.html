<script>
/* Display settings: theme (auto/light/dark) and accent color. Applied early to avoid a flash. */
(function(){
  var root=document.documentElement,BG={light:'#EEEBE3',dark:'#121210'};
  function store(k,v){try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){}}
  function load(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function rgb(h){h=h.replace('#','');return [0,2,4].map(function(i){return parseInt(h.substr(i,2),16);});}
  function lum(c){var a=c.map(function(v){v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});return 0.2126*a[0]+0.7152*a[1]+0.0722*a[2];}
  function ratio(a,b){var x=lum(a),y=lum(b);if(x<y){var t=x;x=y;y=t;}return (x+0.05)/(y+0.05);}
  function toHsl(c){var r=c[0]/255,g=c[1]/255,b=c[2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,h=0,s=0,d=mx-mn;
    if(d){s=l>0.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;}return [h,s,l];}
  function fromHsl(h,s,l){function f(n){var k=(n+h/30)%12,a=s*Math.min(l,1-l);return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))));}return [f(0),f(8),f(4)];}
  function hex(c){return '#'+c.map(function(v){return ('0'+v.toString(16)).slice(-2);}).join('');}
  function readable(base,mode){ /* shift lightness until text-sized contrast (4.5:1) is met against the page background */
    var bg=rgb(BG[mode]),c=rgb(base),h=toHsl(c),l=h[2],step=mode==='dark'?0.01:-0.01,n=0;
    while(ratio(fromHsl(h[0],h[1],l),bg)<4.5&&n++<100){l=Math.max(0,Math.min(1,l+step));}
    return fromHsl(h[0],h[1],l);}
  function effective(){var t=root.getAttribute('data-theme');if(t==='dark'||t==='light')return t;return window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}
  var HT={
    theme:load('ht-theme')||'auto',accent:load('ht-accent')||'',
    apply:function(){
      if(this.theme==='auto')root.removeAttribute('data-theme');else root.setAttribute('data-theme',this.theme);
      if(this.accent&&/^#[0-9a-f]{6}$/i.test(this.accent)){ /* presets only */
        var m=effective(),c=readable(this.accent,m),on=ratio(c,[255,255,255])>=ratio(c,[11,14,20])?'#FFFFFF':'#0B0E14';
        root.style.setProperty('--accent',hex(c));root.style.setProperty('--on-accent',on);
      }else{root.style.removeProperty('--accent');root.style.removeProperty('--on-accent');}
    },
    setTheme:function(t){this.theme=t;store('ht-theme',t==='auto'?null:t);this.apply();},
    setAccent:function(a){this.accent=a||'';store('ht-accent',a||null);this.apply();}
  };
  window.HT=HT;HT.apply();
  if(window.matchMedia){var mq=matchMedia('(prefers-color-scheme: dark)');var f=function(){HT.apply();};if(mq.addEventListener)mq.addEventListener('change',f);}
})();
